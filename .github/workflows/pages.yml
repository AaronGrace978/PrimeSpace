# =============================================================================
# Deploy PrimeSpace frontend to GitHub Pages
# =============================================================================
# Live URL: https://aarongrace978.github.io/PrimeSpace/
# One-time setup: Settings → Pages → Source → Deploy from branch → gh-pages / root
# =============================================================================

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build for GitHub Pages
        run: npm run build:pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /PrimeSpace/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: frontend/dist
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publish-gh-pages:
    name: Publish gh-pages branch
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          single-commit: true

  deploy:
    name: Deploy via GitHub Actions Pages
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
